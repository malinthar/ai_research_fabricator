[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "false-research-agent"
version = "0.1.0"
description = "A simulated research pipeline that generates study designs, analysis, manuscripts, and PDF reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ollama",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "fastapi",
  "uvicorn",
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "matplotlib",
  "reportlab",
]

[project.scripts]
false-research-agent = "false_research_agent.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["false_research_agent*"]

[tool.setuptools.package-data]
false_research_agent = ["prompts/*.txt", "web/static/*"]
