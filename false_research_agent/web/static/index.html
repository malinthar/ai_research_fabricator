<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Local research artifact generator</p>
          <h1>Research Agent</h1>
          <p class="subtitle">Generate a controlled experimental research artifact locally using Ollama.</p>
        </div>
      </header>

      <section class="card form-card">
        <h2>Run a new study</h2>
        <form id="run-form">
          <div class="example-row">
            <label>
              Example set
              <select id="example-select">
                <option value="">Select a preset...</option>
                <option value="feedback_ai">AI feedback vs human feedback</option>
                <option value="micro_quiz">Micro-quizzes and retention</option>
                <option value="peer_ai">AI peer review confidence</option>
              </select>
            </label>
            <button type="button" id="load-example">Load example</button>
          </div>
          <label>
            Objective
            <textarea id="objective" rows="3" placeholder="High-level research objective"></textarea>
          </label>
          <label>
            Hypothesis
            <textarea id="hypothesis" rows="3" placeholder="Predefined false hypothesis"></textarea>
          </label>
          <div class="grid">
            <label>
              Model
              <input id="model" type="text" placeholder="qwen2.5" />
            </label>
            <label>
              Seed
              <input id="seed" type="number" min="0" placeholder="42" />
            </label>
            <label>
              Temperature
              <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="0.2" />
            </label>
            <label>
              Top-p
              <input id="top_p" type="number" min="0" max="1" step="0.05" placeholder="0.9" />
            </label>
          </div>
          <button type="submit" id="run-button">Generate artifact</button>
        </form>
      </section>

      <section class="card output-card">
        <h2>Run output</h2>
        <div id="status">Waiting for a run...</div>
        <div id="output-links" class="output-links"></div>
        <pre id="analysis-preview" class="analysis-preview"></pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
